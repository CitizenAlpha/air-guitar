<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Air Guitar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a late-night jam, playful, almost no chrome
   IDEA: a dark stage where light is stretched into strings
   PICTURE: the live camera (or a dark stage) with glowing strings, chord pads or a note highway, and a tracked hand skeleton
   COLOUR and TYPE: night ground, strings coloured by pitch (cyan low to pink high), mint for active controls; Chakra Petch titles, system body
   LAYOUT: full-screen stage, thin control strips top and bottom, start card with three modes */
:root{color-scheme:dark;--bg:#05060c;--ink:#eef3ff;--dim:#a3aecb;--glass:rgba(14,17,30,.74);--line:rgba(255,255,255,.16);--acc:#7df9c4;--hot:#ff6fae}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar,.foot{position:fixed;left:0;right:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.bar{top:0;padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:18px;background:linear-gradient(rgba(5,6,12,.85),transparent)}
.foot{bottom:0;padding-top:18px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,rgba(5,6,12,.88))}
.bar>*,.row>*{pointer-events:auto}
h1{font:700 22px/1 "Chakra Petch",system-ui,sans-serif;margin:0 auto 0 0;pointer-events:none!important}
button,select{font:600 15px/1 system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
select{font-size:16px;padding-right:10px}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed=true]{background:var(--acc);color:#04130c;border-color:transparent}
#hint{margin:0;width:100%;font-size:14px;color:var(--dim);pointer-events:none}
#hint.warn{color:var(--hot)}
.row{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.seg button{border:0;border-radius:0}
body[data-mode=doodle] .ch,body[data-mode=doodle] .mg,body[data-mode=doodle] .bm,body[data-mode=chords] .dd,body[data-mode=chords] .mg,body[data-mode=magic] .dd,body[data-mode=magic] .ch{display:none!important}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);background:rgba(5,6,12,.72);overflow-y:auto}
#intro[hidden]{display:none}
.card{max-width:460px;width:100%;background:rgba(10,12,24,.95);border:1px solid var(--line);border-radius:20px;padding:22px}
.card h2{font:700 clamp(36px,10vw,50px)/1.05 "Chakra Petch",system-ui,sans-serif;margin:0 0 8px}
.card p{color:var(--dim);margin:0 0 14px}
.modes{display:grid;gap:8px;margin:0 0 14px}
.modes button{display:block;width:100%;text-align:left;padding:12px 14px;min-height:64px;line-height:1.3}
.modes button b{display:block;font:700 18px/1.2 "Chakra Petch",system-ui,sans-serif;margin-bottom:2px}
.modes button span{font-weight:500;font-size:14px;color:var(--dim)}
.modes button[aria-pressed=true] span{color:#0b3a28}
#how{padding-left:22px;margin:0 0 16px;color:var(--dim)}
#how li{margin:5px 0}#how b{color:var(--ink)}
.big{width:100%;min-height:54px;font-size:17px;margin-bottom:10px}
.primary{background:var(--acc);color:#04130c;border:0}
#err{color:var(--hot);font-size:14px;margin:4px 0 8px}
#err:empty{display:none}
.small{font-size:13px;margin:0!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mode="magic">
<canvas id="stage" aria-label="Instrument stage"></canvas>

<header class="bar">
  <h1>Air Guitar</h1>
  <select id="mode" aria-label="Mode"><option value="magic">Magic Songs</option><option value="chords">Chord Band</option><option value="doodle">Doodle</option></select>
  <button id="undo" class="dd">Undo</button>
  <button id="clear" class="dd">Clear</button>
</header>

<footer class="foot">
  <p id="hint"></p>
  <div class="row">
    <div class="seg dd" role="group" aria-label="Touch mode">
      <button id="mDraw" aria-pressed="true">Draw</button>
      <button id="mStrum" aria-pressed="false">Strum</button>
    </div>
    <select id="scale" class="dd" aria-label="Scale">
      <option value="pent">E pentatonic</option><option value="major">E major</option><option value="chrom">Chromatic</option><option value="free">Free pitch</option>
    </select>
    <select id="song" class="mg" aria-label="Song"></select>
    <button id="lefty" class="ch" aria-pressed="false">Left-handed</button>
    <button id="band" class="bm" aria-pressed="false">Band</button>
    <select id="tone" aria-label="Tone"><option value="acoustic">Acoustic</option><option value="electric">Electric</option></select>
    <button id="cam" aria-pressed="false">Camera</button>
  </div>
</footer>

<section id="intro">
  <div class="card">
    <h2>Air Guitar</h2>
    <p>Pick a way to play.</p>
    <div class="modes" id="modePick">
      <button data-m="magic"><b>Magic Songs</b><span>Strum in time and every strum plays the next note of a real tune.</span></button>
      <button data-m="chords"><b>Chord Band</b><span>One hand picks the chord, the other strums six real strings. Add the band.</span></button>
      <button data-m="doodle"><b>Doodle</b><span>Draw your own strings of light. Grab an end and stretch it to bend the note.</span></button>
    </div>
    <ol id="how"></ol>
    <button class="big primary" id="goCam">Start with camera</button>
    <button class="big" id="goTouch">Play with touch</button>
    <p id="err" role="alert"></p>
    <p class="small" style="color:var(--dim)">Hand tracking runs on your phone. Video is not uploaded. Turn the silent switch off if you hear nothing.</p>
  </div>
</section>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('stage'),ctx=cv.getContext('2d');
let W=1,H=1;
function resize(){const r=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*r);cv.height=Math.round(H*r);ctx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const diag=()=>Math.hypot(W,H);
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const mf=m=>440*2**((m-69)/12);
const nameOf=m=>{const r=Math.round(m);return NOTES[((r%12)+12)%12]+(Math.floor(r/12)-1)};
const letter=m=>NOTES[((Math.round(m)%12)+12)%12];
const hueOf=m=>190+(m-40)*4;
let mode='magic',tone='acoustic';
try{const s=localStorage.getItem('ag-mode');if(s)mode=s}catch(e){}

/* ================= AUDIO ================= */
let ac=null,buses={},bandBus=null,noise=null;const cache=new Map();
function initAudio(){
  if(ac){if(ac.state!=='running')ac.resume().catch(()=>{});return}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  const master=ac.createGain();master.gain.value=.9;master.connect(comp);
  const verb=ac.createConvolver();verb.buffer=impulse(1.8);const wet=ac.createGain();wet.gain.value=.2;verb.connect(wet);wet.connect(master);
  const clean=ac.createGain();clean.connect(master);clean.connect(verb);
  const dIn=ac.createGain();dIn.gain.value=2.4;const sh=ac.createWaveShaper();sh.curve=distCurve(30);sh.oversample='4x';
  const cab=ac.createBiquadFilter();cab.type='lowpass';cab.frequency.value=3200;cab.Q.value=.8;
  const ch=ac.createDelay();ch.delayTime.value=.012;const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.8;lg.gain.value=.003;lfo.connect(lg);lg.connect(ch.delayTime);lfo.start();
  const dOut=ac.createGain();dOut.gain.value=.3;dIn.connect(sh);sh.connect(cab);cab.connect(dOut);cab.connect(ch);ch.connect(dOut);dOut.connect(master);dOut.connect(verb);
  buses={acoustic:clean,electric:dIn};
  bandBus=ac.createGain();bandBus.gain.value=.55;bandBus.connect(master);
  noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  if(ac.state!=='running')ac.resume().catch(()=>{});
  setInterval(bandTick,25);
}
function impulse(sec){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b}
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}
function ksBuffer(f){
  const key=Math.round(f*10);if(cache.has(key))return cache.get(key);
  const sr=ac.sampleRate,len=Math.floor(sr*2.8),buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/f-.5)),decay=1-.0011*Math.sqrt(f/100);
  let prev=0;for(let i=0;i<N;i++){prev=prev*.4+(Math.random()*2-1)*.6;d[i]=prev}
  for(let i=N;i<len;i++){const b=i-N-1>=0?d[i-N-1]:0;d[i]=decay*.5*(d[i-N]+b)}
  let mean=0;for(let i=0;i<N;i++)mean+=d[i];mean/=N;let peak=0;for(let i=0;i<len;i++){d[i]-=mean*Math.exp(-i/sr*8);peak=Math.max(peak,Math.abs(d[i]))}
  const fade=2000;for(let i=0;i<len;i++){d[i]*=.9/(peak||1);if(i>len-fade)d[i]*=(len-i)/fade}
  cache.set(key,buf);return buf;
}
/* one plucked note; returns the source so Doodle can bend it */
function playNote(f,vel,pan=0,when=0){
  if(!ac||!buses[tone])return null;const t=Math.max(ac.currentTime,when||0);
  const src=ac.createBufferSource();src.buffer=ksBuffer(f);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500+6500*vel;
  const g=ac.createGain();g.gain.value=.22+.7*vel;src.connect(lp);lp.connect(g);
  if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=clamp(pan,-1,1)*.6;g.connect(p);p.connect(buses[tone])}else g.connect(buses[tone]);
  src.start(t);return src;
}
function chuck(vel,when){if(!ac)return;const t=Math.max(ac.currentTime,when||0);const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1600;f.Q.value=1.2;const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5*vel+.1,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.06);s.connect(f);f.connect(g);g.connect(buses[tone]||bandBus);s.start(t);s.stop(t+.08)}
function env(g,t,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function drum(k,t,v=1){if(!ac)return;const g=ac.createGain();
  if(k==='k'){const o=ac.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);env(g,t,1*v,.3);o.connect(g);o.start(t);o.stop(t+.32)}
  else{const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=k==='s'?1500:7500;env(g,t,(k==='s'?.5:.16)*v,k==='s'?.16:.04);s.connect(f);f.connect(g);s.start(t);s.stop(t+.2)}
  g.connect(bandBus)}
function bass(m,t,d){if(!ac)return;const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=ac.createGain();env(g,t,.42,d);o.connect(f);f.connect(g);g.connect(bandBus);o.start(t);o.stop(t+d+.05)}
/* backing band: drums always, bass follows the chord in Chord Band */
const band={on:false,next:0,step:0};
function bandTick(){if(!ac||!band.on)return;const bpm=mode==='magic'?SONGS[songIdx].bpm:96,e=60/bpm/2;if(band.next<ac.currentTime-.1)band.next=ac.currentTime+.05;
  while(band.next<ac.currentTime+.12){const s=band.step%8,t=band.next;if(s===0||s===4)drum('k',t);if(s===2||s===6)drum('s',t,.9);drum('h',t,s%2?.6:1);
    if(mode==='chords'&&(s===0||s===3||s===4||s===6)){const r=CH.list[CH.cur].root;bass(r+(s===3?7:0),t,e*1.6)}
    band.step++;band.next+=e}}

/* ================= HAND TRACKING (shared) ================= */
let landmarker=null,video=null,camOn=false,lastVT=-1,lastHand=0;const handState={};let frameHands=[];
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
async function startCamera(){
  initAudio();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  setHint('Starting camera…');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  try{video=document.createElement('video');video.setAttribute('playsinline','');video.playsInline=true;video.muted=true;video.srcObject=stream;await video.play();
    if(!landmarker){setHint('Loading hand tracking (about 15 MB, first time only)…');const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
      const{FilesetResolver,HandLandmarker}=await import(V+'/vision_bundle.mjs');const fs=await FilesetResolver.forVisionTasks(V+'/wasm');
      const opts=dg=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:dg},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.6,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
      try{landmarker=await HandLandmarker.createFromOptions(fs,opts('GPU'))}catch(_){landmarker=await HandLandmarker.createFromOptions(fs,opts('CPU'))}}
  }catch(e){stream.getTracks().forEach(t=>t.stop());throw e}
  camOn=true;lastHand=performance.now();setCamBtn();if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});setHint(MODES[mode].camHint);
}
function stopCamera(){if(video&&video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());camOn=false;DD.draft=null;frameHands=[];setCamBtn();setHint('Camera off. Touch play still works.')}
function camErr(e){
  if(e&&(e.name==='NotFoundError'||e.name==='OverconstrainedError'))return 'No front camera was found on this device. Touch play still works.';
  if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'||e.message==='nocam'))return window.top!==window.self?'The camera is blocked inside this app. Open the link in Safari or Chrome for hand tracking. Touch play works here.':'Camera access was refused. Allow the camera for this site in your browser settings, then try again.';
  return 'Hand tracking could not start ('+((e&&(e.message||e.name))||'unknown error')+'). Check your connection and try again.';
}
function cover(){const vw=video.videoWidth||640,vh=video.videoHeight||480,sc=Math.max(W/vw,H/vh);return{vw,vh,sc,dx:(W-vw*sc)/2,dy:(H-vh*sc)/2}}
function track(now){
  if(!camOn||!landmarker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  let res;try{res=landmarker.detectForVideo(video,now)}catch(_){return}
  const c=cover(),seen=new Set();frameHands=[];
  (res.landmarks||[]).forEach((lm,i)=>{
    let key=(res.handedness&&res.handedness[i]&&res.handedness[i][0]&&res.handedness[i][0].categoryName)||'H';if(seen.has(key))key+=i;seen.add(key);
    const P=lm.map(p=>[W-(c.dx+p.x*c.vw*c.sc),c.dy+p.y*c.vh*c.sc]);
    const st=handState[key]||(handState[key]={pinch:false,releasedAt:0,seen:0});
    const size=Math.hypot(P[0][0]-P[9][0],P[0][1]-P[9][1])||1,r=Math.hypot(P[4][0]-P[8][0],P[4][1]-P[8][1])/size;
    const fresh=now-st.seen<160,was=st.pinch;st.pinch=was?r<.55:r<.32;if(was&&!st.pinch)st.releasedAt=now;
    const mid=[(P[4][0]+P[8][0])/2,(P[4][1]+P[8][1])/2];st.pp=st.pp&&fresh?[st.pp[0]*.45+mid[0]*.55,st.pp[1]*.45+mid[1]*.55]:mid;
    const palm=[0,5,9,13,17].reduce((a,k)=>[a[0]+P[k][0]/5,a[1]+P[k][1]/5],[0,0]);
    const fist=[8,12,16,20].reduce((a,k)=>a+Math.hypot(P[k][0]-palm[0],P[k][1]-palm[1]),0)/4<size*.75;
    frameHands.push({key,P,st,palm,fist,tip:P[8],prevTip:fresh?st.tip:null,dt:fresh?Math.max(8,now-st.t):0,pinch:st.pinch,wasPinch:was,fresh});
  });
  if(frameHands.length)lastHand=now;
  for(const k in handState){const s=handState[k];if(now-s.seen>400&&s.grab){DD.release(s.grab);s.grab=null}}
  MODES[mode].hands(frameHands,now);
  for(const h of frameHands){h.st.tip=h.tip;h.st.t=now;h.st.seen=now}
}
/* segment crossing helpers */
function crossH(y,x0,x1,ax,ay,bx,by){if((ay-y)*(by-y)>0||ay===by)return null;const k=(y-ay)/(by-ay),x=ax+(bx-ax)*k;return x>=x0&&x<=x1?{x,k}:null}

/* ================= SPARKS / POP ================= */
const sparks=[];let pop=null;
function burst(x,y,hue,n=12,v=1){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=1+Math.random()*4*v;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,h:hue})}if(sparks.length>400)sparks.splice(0,sparks.length-400)}

/* ================= MODE: DOODLE ================= */
const SCALES={pent:[4,7,9,11,2],major:[4,6,8,9,11,1,3],chrom:null,free:null};let scaleKey='pent',touchMode='draw';
function pitchFor(len){const f=clamp(82.41*.85*diag()/len,82.41,659.26);const m=69+12*Math.log2(f/440);if(scaleKey==='free')return{f,m};
  const set=SCALES[scaleKey];let best=Math.round(m);if(set){let bd=99;for(let k=Math.floor(m)-4;k<=Math.ceil(m)+4;k++){const pc=((k%12)+12)%12;if(set.includes(pc)&&Math.abs(k-m)<bd){bd=Math.abs(k-m);best=k}}}
  best=clamp(best,40,76);return{f:mf(best),m:best}}
const freeFreq=len=>clamp(82.41*.85*diag()/Math.max(20,len),55,1320);
const DD={
  strings:[],draft:null,waitClear:false,MAX:12,
  ends(s){return[s.ax*W,s.ay*H,s.bx*W,s.by*H]},
  add(x1,y1,x2,y2,quiet){const len=Math.hypot(x2-x1,y2-y1);if(len<Math.max(40,diag()*.07))return false;const p=pitchFor(len),now=performance.now();
    const s={ax:x1/W,ay:y1/H,bx:x2/W,by:y2/H,lf:len/diag(),f:p.f,m:p.m,hue:hueOf(p.m),born:now,t0:now,amp:.5,cool:{},grabbed:0};this.strings.push(s);if(this.strings.length>this.MAX)this.strings.shift();if(!quiet)this.sound(s,.35);return true},
  sound(s,vel){const src=playNote(s.f,vel,(s.ax+s.bx)-1);if(src)s.voice={src,f0:s.f,t:performance.now()}},
  pluck(s,vel,x,y){s.amp=Math.min(1,.35+vel);s.t0=performance.now();this.sound(s,vel);burst(x,y,s.hue,12,.5+vel)},
  retune(){for(const s of this.strings){if(s.free)continue;const p=pitchFor(s.lf*diag());s.f=p.f;s.m=p.m;s.hue=hueOf(p.m)}},
  cross(s,x1,y1,x2,y2){const[ax,ay,bx,by]=this.ends(s),dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1;const d1=(dx*(y1-ay)-dy*(x1-ax))/L,d2=(dx*(y2-ay)-dy*(x2-ax))/L;
    if(d1*d2>0||d1===d2)return null;const k=d1/(d1-d2),ix=x1+(x2-x1)*k,iy=y1+(y2-y1)*k,t=((ix-ax)*dx+(iy-ay)*dy)/(L*L);return t>=0&&t<=1?{ix,iy}:null},
  sweep(x1,y1,x2,y2,dt,who){const dist=Math.hypot(x2-x1,y2-y1);if(dist<2)return;const now=performance.now(),vel=Math.max(.15,Math.min(1,dist/Math.max(dt,8)/1.6));

function label(text,x,y,hue){ctx.font='600 13px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=`hsl(${hue},100%,85%)`;const w=ctx.measureText(text).width;ctx.fillText(text,Math.min(Math.max(x+9,6),W-w-6),Math.max(y-9,16))}
function drawDraft(ax,ay,bx,by){const len=Math.hypot(bx-ax,by-ay),ok=len>=Math.max(40,diag()*.07);ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.strokeStyle=ok?'rgba(125,249,196,.95)':'rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);if(ok){const p=pitchFor(len);label(nameOf(p.m),bx,by,hueOf(p.m))}}
function drawHand(h){const P=h.P;ctx.strokeStyle='rgba(90,240,120,.85)';ctx.lineWidth=2.5;ctx.beginPath();for(const[a,b]of CONN){ctx.moveTo(P[a][0],P[a][1]);ctx.lineTo(P[b][0],P[b][1])}ctx.stroke();
  ctx.fillStyle='#ff3b3b';for(const p of P){ctx.beginPath();ctx.arc(p[0],p[1],3,0,6.283);ctx.fill()}
  ctx.beginPath();ctx.arc(P[8][0],P[8][1],9,0,6.283);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  if(h.pinch){ctx.beginPath();ctx.arc(h.st.pp[0],h.st.pp[1],14,0,6.283);ctx.strokeStyle='#7df9c4';ctx.lineWidth=3;ctx.stroke()}}
let bgGrad=null,bgW=0,bgH=0;
function frame(now){
  track(now);
  if(camOn&&video.readyState>=2){const c=cover();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,c.dx,c.dy,c.vw*c.sc,c.vh*c.sc);ctx.restore();ctx.fillStyle='rgba(4,6,14,.45)';ctx.fillRect(0,0,W,H)}
  else{if(!bgGrad||bgW!==W||bgH!==H){bgGrad=ctx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,diag()*.6);bgGrad.addColorStop(0,'#16203f');bgGrad.addColorStop(1,'#05060c');bgW=W;bgH=H}ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H)}
  MODES[mode].draw(now);
  for(const h of frameHands)drawHand(h);
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.97;p.life-=.025;if(p.life<=0){sparks.splice(i,1);continue}ctx.fillStyle=`hsla(${p.h},100%,80%,${p.life})`;ctx.fillRect(p.x-1.5,p.y-1.5,3,3)}
  if(pop){const dt=now-pop.t0;if(dt>1600)pop=null;else{const sc=1+.3*Math.exp(-dt/120);ctx.save();ctx.translate(W/2,H*.45);ctx.scale(sc,sc);ctx.globalAlpha=dt<1200?1:1-(dt-1200)/400;ctx.fillStyle='#7df9c4';ctx.font=`700 ${Math.round(Math.min(W*.09,60))}px "Chakra Petch",system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pop.t,0,0);ctx.restore()}}
  if(camOn&&now-lastHand>2500)setHint('Show your hands to the camera. Prop the phone up to use both hands.',true);
  requestAnimationFrame(frame);
}

/* ================= INPUT ================= */
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{initAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now()};ptrs.set(e.pointerId,p);MODES[mode].down(e,p)});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const t=performance.now();MODES[mode].move(e,p,t-p.t);p.x=e.clientX;p.y=e.clientY;p.t=t});
function endPtr(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);MODES[mode].up(p)}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='SELECT')return;initAudio();if(MODES[mode].key(e))e.preventDefault()});

/* ================= UI ================= */
let hintText='';
function setHint(t,warn){if(t===hintText)return;hintText=t;const h=$('hint');h.textContent=t;h.classList.toggle('warn',!!warn)}
function setCamBtn(){$('cam').setAttribute('aria-pressed',camOn);$('cam').textContent=camOn?'Camera on':'Camera'}
function setMode(m){mode=m;document.body.dataset.mode=m;$('mode').value=m;try{localStorage.setItem('ag-mode',m)}catch(e){}
  document.querySelectorAll('#modePick button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  $('how').innerHTML=MODES[m].how.map(t=>`<li>${t}</li>`).join('');MODES[m].enter();band.step=0;setHint(camOn?MODES[m].camHint:MODES[m].touchHint)}
function setTouch(m){touchMode=m;$('mDraw').setAttribute('aria-pressed',m==='draw');$('mStrum').setAttribute('aria-pressed',m==='strum');setHint(m==='draw'?DD.touchHint:'Strum: swipe across strings to play them. Drag a string end to bend it.')}
$('mode').onchange=e=>setMode(e.target.value);
document.querySelectorAll('#modePick button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('mDraw').onclick=()=>setTouch('draw');$('mStrum').onclick=()=>setTouch('strum');
$('undo').onclick=()=>{DD.strings.pop()};$('clear').onclick=()=>{DD.strings.length=0;setHint('Drag to draw a new string.')};
$('scale').onchange=e=>{scaleKey=e.target.value;DD.retune()};
$('tone').onchange=e=>{tone=e.target.value;initAudio()};
$('song').innerHTML=SONGS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');
$('song').onchange=e=>{songIdx=+e.target.value;MG.enter()};
$('lefty').onclick=()=>{CH.lefty=!CH.lefty;$('lefty').setAttribute('aria-pressed',CH.lefty)};
$('band').onclick=()=>{initAudio();band.on=!band.on;band.step=0;if(ac)band.next=ac.currentTime+.08;$('band').setAttribute('aria-pressed',band.on)};
$('cam').onclick=async()=>{if(camOn){stopCamera();return}try{await startCamera()}catch(e){setHint(camErr(e),true)}};
$('goTouch').onclick=()=>{initAudio();$('intro').hidden=true;setHint(MODES[mode].touchHint)};
$('goCam').onclick=async()=>{const b=$('goCam');b.disabled=true;b.textContent='Starting…';$('err').textContent='';try{await startCamera();$('intro').hidden=true}catch(e){$('err').textContent=camErr(e)}b.disabled=false;b.textContent='Start with camera'};
setInterval(()=>{if($('intro').hidden)return;if(mode==='doodle'&&DD.strings.length){const s=DD.strings[Math.floor(Math.random()*DD.strings.length)];s.amp=.8;s.t0=performance.now()}
  if(mode==='chords'){const i=Math.floor(Math.random()*6);CH.amp[i]=.8;CH.t0[i]=performance.now()}if(mode==='magic')MG.flash=performance.now()},700);
window.__ag={DD,CH,MG,setMode,get frameHands(){return frameHands},SONGS};
DD.seed();setMode(MODES[mode]?mode:'magic');
requestAnimationFrame(frame);
}
</script>
</body>
